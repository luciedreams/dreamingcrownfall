<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src https: data: file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Overlay</title>
<style>
    /* Eine Ebene über dem Spiel (overlay.js): Überblenden beim Wechsel, Ladebildschirm, Fehlerseite.
       Nichts blinkt: ein- und ausgeblendet wird weich, der Ladebalken läuft ruhig durch. */
    :root { --bg1: #201634; --bg2: #120d1c; --text: #ece4f7; --muted: #a99cc0; --dim: #7d7194; --violet: #b48ae8; --gold: #ffd36e; --red: #ff8a8a; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; user-select: none; font: 14px/1.4 system-ui, sans-serif; color: var(--text); }
    /* Wechsel wie in einem Spiel (Luce 17.10.: Überblenden auf die LIVE-Seite war „ein harter Cut“,
       das Spiel ploppte beim Sichtbarwerden auf). Gezeigt werden nur Bilder, nie die Seite im Aufbau:
         dip     altes Bild verschwimmt und dunkelt ab (DIP)
         arrive  Bild der FERTIG gezeichneten neuen Seite, erst unscharf, dann langsam scharf und hell (RISE)
         reveal  Ebene weg — darunter liegt die echte Seite, genauso wie das letzte Bild. */
       Unschärfe wird nicht als Filter animiert (der schnappte am Ende um), sondern zwischen einer
       scharfen und einer unscharfen Kopie übergeblendet — das läuft immer weich. */
    .layer { position: fixed; inset: 0; opacity: 0; transition: opacity 180ms ease-out; }
    .layer.on { opacity: 1; }
    .layer.instant { transition: none; }
    .shot { background: center / 100% 100% no-repeat; }
    .soft { filter: blur(16px) brightness(0.5) saturate(0.85); transform: scale(1.04); }   /* scale: keine hellen Blur-Ränder */
    #shot.dip { transition: opacity 320ms cubic-bezier(0.45, 0, 0.55, 1); }
    #nextSoft.in { transition: opacity 240ms ease-out; }
    #next.in { transition: opacity 560ms cubic-bezier(0.25, 0.1, 0.25, 1); }
    #screen {
        display: grid; place-items: center; transition: opacity 700ms cubic-bezier(0.33, 0, 0.2, 1);
        background: radial-gradient(900px 500px at 50% 30%, rgba(139, 92, 246, 0.2), transparent 65%), linear-gradient(180deg, var(--bg1), var(--bg2));
    }
    .card { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; max-width: 520px; padding: 0 24px; }
    .por { width: 96px; height: 96px; border-radius: 50%; border: 3px solid var(--gold); box-shadow: 0 0 28px rgba(255, 211, 110, 0.3); object-fit: cover; background: #1a1228; }
    .crest { width: 96px; height: 96px; }
    .ini { display: grid; place-items: center; color: var(--violet); font-weight: 800; font-size: 40px; }
    .kicker { color: var(--gold); font-size: 11px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; }
    h1 { margin: 0; font-size: 24px; font-weight: 800; }
    p { margin: 0; color: var(--muted); }
    .track { width: 240px; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
    .track i { display: block; width: 35%; height: 100%; border-radius: 4px; background: linear-gradient(90deg, transparent, var(--violet), var(--gold), transparent); animation: run 1.6s ease-in-out infinite; }
    @keyframes run { from { transform: translateX(-100%); } to { transform: translateX(290%); } }
    .err h1 { color: var(--red); }
    .err .track { display: none; }
    button { margin-top: 6px; border: 1px solid rgba(180, 138, 232, 0.45); background: rgba(139, 92, 246, 0.18); color: var(--text); border-radius: 10px; padding: 9px 18px; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: rgba(139, 92, 246, 0.32); border-color: var(--violet); }
    small { color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<div class="layer" id="screen"><div class="card" id="card"></div></div>
<div class="layer shot soft" id="shotSoft"></div>
<div class="layer shot" id="shot"></div>
<div class="layer shot soft" id="nextSoft"></div>
<div class="layer shot" id="next"></div>
<script>
    const $ = (id) => document.getElementById(id);
    const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
    const frames = (n = 2) => new Promise((r) => { const step = () => (--n <= 0 ? r() : requestAnimationFrame(step)); requestAnimationFrame(step); });
    let state = 'none';

    function portrait(m) {
        if (m.icon) { const i = el('img', 'crest'); i.src = m.icon; return i; }
        if (m.avatar) { const i = el('img', 'por'); i.src = m.avatar; i.onerror = () => i.replaceWith(el('div', 'por ini', (m.name || '?').charAt(0).toUpperCase())); return i; }
        return el('div', 'por ini', (m.name || '?').trim().charAt(0).toUpperCase());
    }
    function drawScreen(m) {
        const card = $('card');
        card.className = 'card' + (m.kind === 'error' ? ' err' : '');
        const kids = [portrait(m)];
        if (m.kind === 'loading') {
            kids.push(el('div', 'kicker', 'DreamingCrownfall'), el('h1', null, m.name ? `Loading ${m.name} …` : 'Loading …'));
            const t = el('div', 'track'); t.append(el('i')); kids.push(t);
        } else {
            kids.push(el('div', 'kicker', m.name || 'DreamingCrownfall'), el('h1', null, "Can't reach Marble Crownfall"),
                el('p', null, m.detail || 'The game does not answer right now. The app keeps trying on its own.'));
            const b = el('button', null, 'Try again now');
            b.onclick = () => window.overlay.retry();
            kids.push(b);
            if (m.code) kids.push(el('small', null, `Error ${m.code}${m.desc ? ' · ' + m.desc : ''}`));
        }
        card.replaceChildren(...kids);
    }

    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    const clear = (...ls) => { for (const l of ls) { l.className = 'layer shot' + (l.id.endsWith('Soft') ? ' soft' : ''); l.style.backgroundImage = ''; } };
    window.overlay.on(async (m) => {
        const shot = $('shot'), next = $('next'), screen = $('screen'), shotSoft = $('shotSoft'), nextSoft = $('nextSoft');
        if (m.kind === 'dip') {
            // Scharfes altes Bild blendet weg, die unscharfe, dunkle Kopie dahinter bleibt.
            shot.className = 'layer shot dip on';
            await frames(1);
            shot.classList.remove('on');
            await wait(330);
            state = 'dip';
            window.overlay.ack(m.id);
            return;
        }
        if (m.kind === 'arrive') {
            // Neue Seite (fertig gezeichnet): erst unscharf über das alte, dann scharf darüber.
            for (const l of [nextSoft, next]) l.style.backgroundImage = `url("${m.img}")`;
            nextSoft.className = 'layer shot soft in';
            next.className = 'layer shot in';
            await frames(2);
            nextSoft.classList.add('on');
            await wait(160);
            next.classList.add('on');
            await wait(580);
            clear(shot, shotSoft);
            state = 'arrived';
            window.overlay.ack(m.id);
            return;
        }
        if (m.kind === 'cover') {
            // Bild des bisherigen Tabs sofort und deckend (scharf, dahinter die unscharfe Kopie) —
            // erst danach schaltet die App darunter um.
            const soft = $('shotSoft');
            for (const l of [shot, soft]) { l.style.backgroundImage = `url("${m.img}")`; }
            soft.className = 'layer shot soft instant on';
            shot.className = 'layer shot instant on';
            await frames(2);
            state = 'cover';
            window.overlay.ack(m.id);
            return;
        }
        if (m.kind === 'loading' || m.kind === 'error') {
            drawScreen(m);
            screen.classList.remove('instant');
            if (m.instant) screen.classList.add('instant');
            screen.classList.add('on');
            // Aus dem (verschwommenen) alten Bild in den Lade-/Fehlerbildschirm: weich darüber blenden.
            if ([shot, shotSoft, next, nextSoft].some((l) => l.classList.contains('on'))) {
                await wait(220);
                clear(shot, shotSoft, next, nextSoft);
            }
            state = m.kind;
            window.overlay.ack(m.id);
            return;
        }
        if (m.kind === 'reveal') {
            // Alles weich weg; danach meldet die Seite „fertig“, und die App blendet die Ebene aus.
            // Ebene weg: nach einem Wechsel liegt darunter dieselbe Seite wie das letzte Bild (kurz und
            // unauffällig), nach dem Ladebildschirm taucht das Spiel weich auf.
            for (const l of [shot, shotSoft, next, nextSoft, screen]) { l.classList.remove('instant', 'dip', 'in'); l.classList.remove('on'); }
            state = 'none';
            window.overlay.ack(m.id);
            setTimeout(() => {
                if (state !== 'none') return;
                clear(shot, shotSoft, next, nextSoft);
                window.overlay.done();
            }, 260);
        }
    });
</script>
</body>
</html>
