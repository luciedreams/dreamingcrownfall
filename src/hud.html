<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>DreamingCrownfall HUD</title>
<style>
    html, body { margin: 0; background: transparent; overflow: hidden; }
    body { display: inline-block; -webkit-app-region: drag; /* am HUD selbst verschieben */ }
</style>
<script src="hud-render.js"></script>
</head>
<body>
<div id="hud"></div>
<script>
    const style = document.createElement('style');
    style.textContent = hudCss();
    document.head.append(style);
    const root = document.getElementById('hud');
    let last = null, size = '';

    function render(s) {
        last = s;
        renderHud(root, s.cfg, s.data, { onClose: () => window.hud.close() });
        // Fenster auf den Inhalt zuschneiden (nur wenn sich die Größe ändert).
        const r = root.getBoundingClientRect();
        const want = `${Math.ceil(r.width)}x${Math.ceil(r.height)}`;
        if (want !== size) { size = want; window.hud.fit(r.width, r.height); }
    }
    window.hud.onState(render);
    window.hud.state().then(render);
    // Thron-Zeit und Uhr laufen zwischen den Abrufen weiter.
    setInterval(() => { if (last) render(last); }, 15000);
</script>
</body>
</html>
