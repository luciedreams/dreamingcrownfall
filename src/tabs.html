<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src https: data: file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Tabs</title>
<style>
    /* Account-Rahmen wie Party-Rahmen in einem Rollenspiel (seit 0.7.0, Luces Wahl aus fünf Entwürfen):
       Porträt mit VIP-Stufe als Level, Name, Punkte, Balken für Daily Quests und „verdient Tickets“. */
    :root {
        --bg1: #1d1431; --bg2: #110c1b; --frame: rgba(10, 8, 18, 0.75); --line: rgba(180, 138, 232, 0.22);
        --text: #ece4f7; --muted: #a99cc0; --dim: #7d7194; --violet: #b48ae8; --gold: #ffd36e; --green: #7fd99a; --danger: #e07a7a;
    }
    * { box-sizing: border-box; }
    html, body {
        margin: 0; height: 100%; color: var(--text); font: 13px/1.2 system-ui, sans-serif; user-select: none; overflow: hidden;
        background: linear-gradient(180deg, var(--bg1), var(--bg2));
    }
    /* Die Leiste ist die Fensterleiste: überall ziehen = Fenster verschieben, außer auf Bedienelementen. */
    body { display: flex; align-items: center; gap: 12px; padding: 0 0 0 16px; border-bottom: 1px solid var(--line); -webkit-app-region: drag; }
    .uf, .add, .ic, .x, .yes, .no, .wb { -webkit-app-region: no-drag; }
    button { font: inherit; color: inherit; cursor: pointer; }
    img { -webkit-user-drag: none; }
    :focus:not(:focus-visible) { outline: none; }
    .logo { width: 30px; height: 30px; flex: none; margin-right: 4px; }
    #frames { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 0 1 auto; }

    .uf {
        position: relative; display: flex; align-items: center; flex: 0 1 auto; width: 230px; min-width: 130px; height: 46px; margin-left: 22px;
        border-radius: 8px; background: var(--frame); border: 1px solid rgba(255, 255, 255, 0.12); cursor: pointer;
        transition: border-color 120ms, background 120ms;
    }
    .uf:hover { border-color: rgba(180, 138, 232, 0.55); background: rgba(24, 18, 40, 0.85); }
    .uf.on { border-color: var(--gold); box-shadow: 0 0 14px rgba(255, 211, 110, 0.25); }
    /* Porträt-Mitte genau auf der linken Kante des Rahmens: so deckt der Kreis dessen runde Ecken ganz ab
       (bei -6px schauten sie oben und unten links heraus, Luce 17.10.). */
    .por { position: relative; flex: none; width: 52px; height: 52px; margin: -6px 6px -6px -26px; border-radius: 50%; border: 3px solid #6b5a8a; background: #1a1228; }
    .uf.on .por { border-color: var(--gold); }
    .por img, .por .ini { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .por .ini { display: grid; place-items: center; color: var(--violet); font-weight: 800; font-size: 18px; }
    .lvl { position: absolute; left: 50%; bottom: -7px; transform: translateX(-50%); padding: 0 4px; border-radius: 5px; background: var(--gold); color: #2a1c05; font-size: 9.5px; font-weight: 900; line-height: 13px; }
    /* Geplante Rebellion des Accounts: auf der oberen Kante, links vom ×. */
    .reb { position: absolute; top: -7px; left: 34px; padding: 0 5px; border-radius: 7px; border: 1px solid #ff6b5a; background: #3a1a1a; color: #ffe1dc; font-size: 9.5px; font-weight: 800; line-height: 13px; white-space: nowrap; pointer-events: none; }
    .reb.warn { background: #6a1a1a; }
    .claim { position: absolute; right: -5px; top: -5px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--gold); color: #2a1c05; font-size: 10.5px; font-weight: 800; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--bg2); }
    .in { flex: 1; min-width: 0; padding-right: 9px; }
    .top { display: flex; align-items: baseline; gap: 6px; }
    .name { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .uf.on .name { color: #fff; }
    .tix { flex: none; display: inline-flex; align-items: center; gap: 3px; color: var(--muted); font-size: 10.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .tix svg { width: 11px; height: 11px; color: #e8c15a; }
    .bar { position: relative; height: 8px; margin-top: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
    .bar i { display: block; height: 100%; }
    .bar.q i { background: linear-gradient(90deg, #7b4fd6, var(--violet)); }
    .bar.t i { background: linear-gradient(90deg, #2f9e5e, var(--green)); }
    .bar em { position: absolute; inset: 0; font-style: normal; font-size: 7.5px; line-height: 8px; text-align: center; color: #fff; font-weight: 800; letter-spacing: 0.06em; text-shadow: 0 0 2px rgba(0, 0, 0, 0.8); }
    .note { margin-top: 3px; color: var(--dim); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .uf.guest .por { border-color: #4a3f5e; }
    .uf.loading { opacity: 0.6; }
    /* Entfernen: × beim Drüberfahren, dann Nachfrage im Rahmen */
    .x { position: absolute; right: -7px; top: -7px; width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg2); color: var(--muted); font-size: 12px; line-height: 1; padding: 0; display: none; }
    .uf:hover .x { display: grid; place-items: center; }
    .x:hover { color: var(--danger); border-color: var(--danger); }
    .uf.confirm { border-color: var(--danger); cursor: default; padding: 0 8px; gap: 6px; }
    .uf.confirm .ask { flex: 1; min-width: 0; color: var(--danger); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .yes, .no { border: 0; border-radius: 5px; padding: 4px 9px; background: #3a2030; font-size: 11.5px; }
    .no { background: #2c2240; }
    /* Viele Accounts: Rahmen werden schmal, nur Porträt und Name */
    body.many .uf { width: 160px; min-width: 112px; }
    body.many .bar, body.many .tix { display: none; }

    .add { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1px dashed rgba(180, 138, 232, 0.4); background: none; color: var(--dim); font-size: 18px; line-height: 1; }
    .add:hover { color: var(--text); border-color: var(--violet); }
    .sp { flex: 1; }
    .ic { flex: none; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; border: 1px solid transparent; background: rgba(255, 255, 255, 0.04); color: var(--violet); }
    .ic:hover { border-color: var(--line); color: var(--text); }
    .ic.on { border-color: var(--gold); color: var(--gold); background: rgba(255, 211, 110, 0.08); }
    .ic.gear { color: var(--muted); }
    .ic svg { width: 18px; height: 18px; }

    /* Fensterknöpfe: volle Leistenhöhe, wie in Spiel-Clients; Schließen wird rot */
    .wbs { display: flex; align-self: stretch; margin-left: 6px; }
    .wb { width: 46px; border: 0; background: none; color: var(--muted); display: grid; place-items: center; }
    .wb svg { width: 14px; height: 14px; }
    .wb:hover { background: rgba(255, 255, 255, 0.07); color: var(--text); }
    .wb.close:hover { background: #c4314b; color: #fff; }
</style>
</head>
<body>
<img class="logo" src="assets/icon.png" alt="">
<div id="frames"></div>
<button class="add" id="add" title="Add account">+</button>
<span class="sp"></span>
<button class="ic" id="home" title="Home: all your accounts at a glance" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-5h4v5"/></svg></button>
<button class="ic" id="stats" title="Stats: live numbers of the whole game (MarbleMind)" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg></button>
<button class="ic" id="wiki" title="Wiki: the community wiki of Marble Crownfall"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5Z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/><path d="M9 7h7M9 11h5"/></svg></button>
<button class="ic gear" id="gear" title="Settings (Ctrl+,) · F2 HUD · F5 reload · F11 full screen" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg></button>
<div class="wbs">
    <button class="wb" id="wmin" title="Minimize"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 7h10"/></svg></button>
    <button class="wb" id="wmax" title="Maximize"></button>
    <button class="wb close" id="wclose" title="Close"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 3l8 8M11 3l-8 8"/></svg></button>
</div>
<script>
    const box = document.getElementById('frames');
    const STAR = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8Z"/></svg>';
    let confirmAt = -1, last = null;

    function el(tag, cls, text) {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text != null) e.textContent = text;
        return e;
    }
    const short = (n) => {
        if (n == null) return '–';
        for (const [v, s] of [[1e9, 'B'], [1e6, 'M'], [1e3, 'K']]) if (n >= v) return (n / v).toFixed(n >= v * 100 ? 0 : 2).replace(/\.?0+$/, '') + s;
        return String(n);
    };
    function bar(cls, share, label) {
        const b = el('div', 'bar ' + cls);
        const i = el('i');
        i.style.width = Math.round(Math.max(0, Math.min(1, share)) * 100) + '%';
        b.append(i, el('em', null, label));
        return b;
    }

    function frame(t, i, s) {
        const f = el('div', 'uf' + (i === s.active ? ' on' : '') + (t.guest ? ' guest' : '') + (t.loading ? ' loading' : ''));
        if (i === confirmAt) {
            f.classList.add('confirm');
            const yes = el('button', 'yes', 'Yes'), no = el('button', 'no', 'No');
            yes.onclick = (e) => { e.stopPropagation(); confirmAt = -1; window.tabs.remove(i); };
            no.onclick = (e) => { e.stopPropagation(); confirmAt = -1; render(last); };
            f.append(el('span', 'ask', `Sign out and remove ${t.name}?`), yes, no);
            return f;
        }
        const por = el('div', 'por');
        const initial = () => el('div', 'ini', (t.name || '?').trim().charAt(0).toUpperCase());
        if (t.avatar) {
            const img = el('img');
            img.src = t.avatar; img.alt = '';
            img.onerror = () => img.replaceWith(initial());
            por.append(img);
        } else por.append(initial());
        if (t.vip != null) por.append(el('span', 'lvl', String(t.vip)));
        if (t.claim) por.append(el('span', 'claim', String(t.claim)));
        f.append(por);

        const inner = el('div', 'in');
        const top = el('div', 'top');
        top.append(el('span', 'name', (t.king ? '👑 ' : '') + (t.guest ? `${t.name}` : t.name)));
        if (!t.guest && t.points != null) {
            const x = el('span', 'tix');
            x.innerHTML = STAR;
            x.prepend(short(t.points) + ' ');
            top.append(x);
        }
        inner.append(top);
        if (t.guest) inner.append(el('div', 'note', t.loading ? 'Loading …' : 'Not signed in – Log in, top right'));
        else {
            const qt = t.questsTotal;
            inner.append(bar('q', qt ? t.questsDone / qt : 0, qt ? `QUESTS ${t.questsDone}/${qt}` : 'QUESTS …'));
            inner.append(bar('t', t.earning ? 1 : 0, t.earning == null ? '…' : t.earning ? 'EARNING' : 'NOT EARNING'));
        }
        f.append(inner);
        const p = !t.guest && t.plan;
        const clock = (ms) => new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const setName = (id) => String(id || '').replace(/([a-z0-9])([A-Z])/g, '$1 $2');
        if (p) f.append(el('span', 'reb' + (p.warn && !p.cost ? ' warn' : ''), p.cost ? `\u2694 x${p.cost / 100} \u00b7 ${clock(p.start)}` : '\u2694 !'));

        const tips = [t.guest ? 'Not signed in' : t.name];
        if (p && p.cost) tips.push(`Planned Rebellion: x${p.cost / 100} for ${setName(p.tileset)} at ${clock(p.start)}`);
        if (p && p.warn) tips.push('A planned Rebellion failed or was missed — see Rebellion › Schedule');
        if (t.king) tips.push('King right now');
        if (t.points != null) tips.push(`${t.points.toLocaleString('en-US')} points`);
        if (t.tickets != null) tips.push(`${t.tickets.toLocaleString('en-US')} tickets${t.earning ? ', earning' : ''}`);
        if (t.vip != null) tips.push(`VIP ${t.vip}`);
        if (t.claim) tips.push(`${t.claim} to claim`);
        if (i < 9) tips.push(`Ctrl+${i + 1} · middle click reloads`);
        f.title = tips.join('\n');

        if (s.tabs.length > 1) {
            const x = el('button', 'x', '×');
            x.title = 'Sign out and remove this account';
            x.onclick = (e) => { e.stopPropagation(); confirmAt = i; render(last); };
            f.append(x);
        }
        f.onclick = () => window.tabs.select(i);
        f.onauxclick = (e) => { if (e.button === 1) window.tabs.reload(i); };
        // Rechtsklick: Menü zeichnet der sichtbare Spiel-Tab direkt unter dem Rahmen (main.js tabs:ctx) —
        // die Leiste selbst kann nicht über das Spiel hinaus wachsen (durchsichtig geht hier nicht).
        f.oncontextmenu = (e) => { e.preventDefault(); window.tabs.contextMenu(i, Math.round(f.getBoundingClientRect().left + 20)); };
        return f;
    }

    function render(s) {
        last = s;
        if (confirmAt >= s.tabs.length) confirmAt = -1;
        document.body.classList.toggle('many', s.tabs.length > 5);
        box.replaceChildren(...s.tabs.map((t, i) => frame(t, i, s)));
        const home = document.getElementById('home'), stats = document.getElementById('stats');
        home.hidden = !s.home; home.classList.toggle('on', s.active === -1);
        stats.hidden = !s.stats; stats.classList.toggle('on', s.active === -2);
        document.getElementById('wiki').classList.toggle('on', s.active === -3);
        const max = document.getElementById('wmax');
        max.title = s.maximized ? 'Restore' : 'Maximize';
        max.innerHTML = s.maximized
            ? '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2" y="4.5" width="7.5" height="7.5"/><path d="M4.5 4.5V2h7.5v7.5H9.5"/></svg>'
            : '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2.5" y="2.5" width="9" height="9"/></svg>';
    }
    document.getElementById('add').onclick = () => window.tabs.add();
    document.getElementById('wmin').onclick = () => window.tabs.minimize();
    document.getElementById('wmax').onclick = () => window.tabs.maximize();
    document.getElementById('wclose').onclick = () => window.tabs.close();
    document.getElementById('gear').onclick = () => window.tabs.settings();
    document.getElementById('home').onclick = () => window.tabs.select(-1);
    document.getElementById('stats').onclick = () => window.tabs.select(-2);
    document.getElementById('stats').onauxclick = (e) => { if (e.button === 1) window.tabs.reload(-2); };
    document.getElementById('wiki').onclick = () => window.tabs.select(-3);
    document.getElementById('wiki').onauxclick = (e) => { if (e.button === 1) window.tabs.reload(-3); };
    window.tabs.onConfirmRemove((i) => { confirmAt = i; render(last); });

    // Interface sounds (seit 0.7.0): kurz und leise, synthetisch — die Leiste lebt immer, deshalb spielt sie
    // für die ganze App (main.js uiSound). open/close = weiches Plopp, select = Tick, switch = zwei Töne.
    let audio = null;
    const SOUNDS = {
        open: [['sine', 520, 760, 0, 0.09]],
        close: [['sine', 700, 460, 0, 0.08]],
        select: [['triangle', 1250, 1250, 0, 0.035]],
        switch: [['sine', 660, 660, 0, 0.09], ['sine', 990, 990, 0.06, 0.11]],
    };
    window.tabs.onSound((kind, volume) => {
        const notes = SOUNDS[kind];
        if (!notes || !(volume > 0)) return;
        try {
            audio = audio || new AudioContext();
            const t0 = audio.currentTime + 0.01, peak = 0.22 * Math.min(1, volume / 100);
            for (const [type, f1, f2, at, len] of notes) {
                const o = audio.createOscillator(), g = audio.createGain();
                o.type = type;
                o.frequency.setValueAtTime(f1, t0 + at);
                o.frequency.exponentialRampToValueAtTime(f2, t0 + at + len);
                g.gain.setValueAtTime(0.0001, t0 + at);
                g.gain.exponentialRampToValueAtTime(peak, t0 + at + 0.008);
                g.gain.exponentialRampToValueAtTime(0.0001, t0 + at + len);
                o.connect(g).connect(audio.destination);
                o.start(t0 + at);
                o.stop(t0 + at + len + 0.02);
            }
        } catch (e) {}
    });
    window.tabs.onState(render);
    window.tabs.state().then(render);
</script>
</body>
</html>
